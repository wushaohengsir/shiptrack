server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Server-level headers are inherited by every location below. Locations
    # avoid their own add_header (that would drop these) and use `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin API: the SPA calls /api/v1/... and nginx forwards the path
    # unchanged. API responses carry per-user data, so browsers must revalidate.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        expires -1;
    }

    # Vite emits content-hashed filenames under /assets, safe to cache long.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # The SPA entry must never be cached: a deploy that reuses the URL would
    # otherwise leave browsers requesting assets that no longer exist.
    location = /index.html {
        expires -1;
    }

    # 架构设计文档终稿 §3.4: the internal agent API is never exposed at the edge.
    # Answer 404 explicitly instead of letting /internal fall through to the SPA
    # shell (which would return 200 HTML). No add_header here, so the
    # server-level security headers above are still inherited (they use
    # `always` and therefore apply to these error responses too).
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    # History-mode router: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
