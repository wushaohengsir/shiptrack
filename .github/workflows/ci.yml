name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a full commit SHA (version in the comment) so a
      # retagged or compromised release cannot change what CI runs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is preinstalled on GitHub-hosted runners, so the Testcontainers
      # MySQL 8.4 migration tests run here too. No database secrets are needed:
      # the containers create throwaway accounts, and the migrate profile only
      # accepts DB_MIGRATION_* supplied by the test itself.
      - name: Build and run all tests
        run: ./mvnw -B -ntp clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7
