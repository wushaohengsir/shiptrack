# Single-host deployment: the API plus its MySQL 8.4 database.
#
#   cd deploy
#   cp .env.example .env        # then fill every change-me value
#   docker compose up -d        # mysql -> one-shot migrate -> app
#
# Every secret is read from deploy/.env (git-ignored); nothing is baked into
# an image. Neither the database nor the API is published beyond loopback.

name: shiptrack

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      # No root account reachable from other containers; bootstrap runs over the socket.
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shiptrack}
      # Read by mysql-init/01-create-users.sh, not by the MySQL entrypoint.
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-shiptrack_migrate}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in deploy/.env}
      DB_APP_USER: ${DB_APP_USER:-shiptrack_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in deploy/.env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # No host port: the database is reachable only on the compose network.
    healthcheck:
      # TCP + business account, not a root socket probe: during bootstrap the
      # official image runs its temporary server with networking disabled, so a
      # socket query would report healthy before the TCP port exists and let
      # `migrate` connect too early. Using DB_APP_* also proves that the init
      # script created the runtime account and granted it this schema.
      # MYSQL_PWD keeps the password out of the process arguments.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$DB_APP_PASSWORD\" mysql --host=127.0.0.1 --port=3306 --user=\"$$DB_APP_USER\" --database=\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot Flyway migration. Uses the DDL account and exits; the API never
  # migrates and never holds DDL credentials. Not behind a profile: `app`
  # depends on this service completing successfully, so every `up` migrates
  # first and a failed migration keeps the new API from starting.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: shiptrack-api:${APP_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shiptrack}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-shiptrack_migrate}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in deploy/.env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx256m}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["--spring.profiles.active=migrate"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: shiptrack-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shiptrack}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_APP_USER:-shiptrack_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in deploy/.env}
      # §1.2 / §5.22: public Bearer token and the collector-only token. Both
      # are mandatory: with either blank the API fails closed (401).
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in deploy/.env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in deploy/.env}
      CONFIG_PATH: /app/config/config.yaml
      STATUS_MAPPING_PATH: /app/config/status-mappings.yaml
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      TASK_CLAIM_TIMEOUT_MS: ${TASK_CLAIM_TIMEOUT_MS:-900000}
      # §7.5 delivery credentials are injected from deploy/.env and never
      # committed. An empty URL makes dispatch fail the queue instead of spinning.
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      # §7.4: explicit false keeps the queue pending instead of failing rows.
      FEISHU_DISPATCH_ENABLED: ${FEISHU_DISPATCH_ENABLED:-true}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Read-only config for GET /config and GET /config/status-mappings.
      - ../config:/app/config:ro
    ports:
      # Loopback only. Public traffic must go through the HTTPS reverse proxy.
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      # GET /api/v1/health is the public probe (no bearer token). When MySQL is
      # unreachable it answers non-2xx (observed 500) or a non-ok body, so
      # require an `ok` body: `collector` and `web` must not start against a
      # database-less API. curl ships with the eclipse-temurin JRE base image.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Browser crawler. A separate image (Chromium + Playwright) that reaches the
  # API only through the compose network with X-Internal-Token. It never
  # receives DB_* credentials and publishes no host port.
  collector:
    build:
      context: ..
      dockerfile: collector/Dockerfile
    image: shiptrack-collector:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      COLLECTOR_BASE_URL: http://app:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in deploy/.env}
      MAPPING_PATH: /app/config/status-mappings.yaml
      TASK_CLAIM_TIMEOUT_MS: ${TASK_CLAIM_TIMEOUT_MS:-900000}
      COLLECTOR_POLL_INTERVAL_MS: ${COLLECTOR_POLL_INTERVAL_MS:-30000}
      JAVA_TOOL_OPTIONS: ${COLLECTOR_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # The API owns this file and bumps `version` on every change.
      - ../config:/app/config:ro
    # Chromium needs shared memory larger than the 64 MB default.
    shm_size: "1gb"
    # The Docker default seccomp profile blocks the clone/unshare flags Chromium
    # needs; this profile only adds those syscalls back.
    security_opt:
      - no-new-privileges:true
      - seccomp=../collector/seccomp-chromium.json
    read_only: true
    tmpfs:
      # Chromium and the JVM write below /tmp; Playwright also uses $HOME.
      # pwuser is uid/gid 1001 in the Playwright base image, so the tmpfs must
      # be owned by 1001:1001 and mode 0700; the default (root:root 0750) leaves
      # $HOME unwritable even though Chromium currently only touches /tmp.
      - /tmp
      - /home/pwuser:uid=1001,gid=1001,mode=0700
    cap_drop:
      - ALL
    stop_grace_period: 20s

  # Static SPA plus the reverse proxy for /api/. The bundle talks to the API
  # same-origin, so no CORS rule or absolute API URL is baked in.
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: http
        VITE_API_BASE_URL: /api/v1
    image: shiptrack-web:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Loopback only, same rule as the API: publish through the HTTPS proxy.
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      # pid file and proxy body buffers live under /tmp.
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mysql-data:
