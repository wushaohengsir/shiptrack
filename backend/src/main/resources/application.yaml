spring:
  application:
    name: shiptrack-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiptrack?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:shiptrack}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 1800000
      # Force every MySQL session to UTC; serverTimezone only affects driver parsing.
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    # API runs on a DML-only account; migrations happen once in the `migrate` profile.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
# Jackson 3 serialises java.time as ISO-8601 by default
# (WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature and is off).

server:
  port: 8080

logging:
  level:
    root: INFO
    com.shiptrack: INFO
