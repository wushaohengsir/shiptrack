spring:
  application:
    name: shiptrack-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiptrack?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:shiptrack}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 1800000
      # Force every MySQL session to UTC; serverTimezone only affects driver parsing.
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    # API runs on a DML-only account; migrations happen once in the `migrate` profile.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
# Jackson 3 serialises java.time as ISO-8601 by default
# (WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature and is off).

server:
  port: 8080

# §1.2 / §5.22: two separate secrets. Both default to blank and therefore fail
# closed (401 on every request) until the deployment provides them.
app:
  access-token: ${API_TOKEN:}
  internal-token: ${INTERNAL_TOKEN:}
  config-path: ${CONFIG_PATH:config/config.yaml}
  status-mapping-path: ${STATUS_MAPPING_PATH:config/status-mappings.yaml}
  scheduler-enabled: ${SCHEDULER_ENABLED:false}
  task-claim-timeout-ms: ${TASK_CLAIM_TIMEOUT_MS:900000}
  # Only needed when the browser talks to the API cross-origin; the bundled
  # Vite dev proxy and the Nginx deployment both keep the same origin.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # §5.15/§7: the webhook URL and secret come from the environment only and are
  # never written to config.yaml, logs or API responses.
  feishu:
    webhook-url: ${FEISHU_WEBHOOK_URL:}
    webhook-secret: ${FEISHU_WEBHOOK_SECRET:}
    dispatch-enabled: ${FEISHU_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${FEISHU_DISPATCH_INTERVAL_MS:1000}
    dispatch-initial-delay-ms: ${FEISHU_DISPATCH_INITIAL_DELAY_MS:1000}
    request-timeout-ms: ${FEISHU_REQUEST_TIMEOUT_MS:5000}
    connect-timeout-ms: ${FEISHU_CONNECT_TIMEOUT_MS:3000}
    sending-timeout-ms: ${FEISHU_SENDING_TIMEOUT_MS:60000}
    first-retry-backoff-ms: ${FEISHU_FIRST_RETRY_BACKOFF_MS:60000}
    second-retry-backoff-ms: ${FEISHU_SECOND_RETRY_BACKOFF_MS:300000}

logging:
  level:
    root: INFO
    com.shiptrack: INFO
